name: Update external skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run skill:sync

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-external-skills
          commit-message: "chore: update external skills"
          title: "chore: update external skills"
          body: |
            Updates vendored external skills to their latest upstream commits.
          delete-branch: true
