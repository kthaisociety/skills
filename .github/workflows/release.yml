# Plan, build and check a release of ais and ais-max for every agent.
#
# Started by hand from the Actions tab. Input:
#   dry_run   boolean, default true. On, the run stops green after the
#             summary and changes nothing. Off, it stops red after the
#             summary, saying publishing isn't set up yet.
#
# Guarantees, in order:
#   1. Started on any ref but refs/heads/main, the run fails before
#      anything else, saying releases run only from main.
#   2. It runs `python3 -m unittest discover -s tests`. A failure fails the run.
#   3. It runs scripts/plan-release.py. When the planner exits non-zero,
#      the run fails with the planner's message, such as
#      "nothing to release since v1.2.0".
#   4. It builds and checks the Claude, Codex and Antigravity trees with the
#      planned version, installing Claude Code and agy first (ADR-0006,
#      ADR-0009). Any build or check failure fails the run.
#   5. It prints the version, the Custom-skills tag from the ais-max sync
#      record, and each tree's skill count per plugin, from the build output.
#   6. Then the dry_run stop above.
#
# Side effects: none outside the runner. No file is committed, no tag is
# pushed, and every job holds only `contents: read`.
#
# A run started while another release run is going waits for it to finish
# (the `release` concurrency group, never cancelling the one in progress).

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan, build and check only. Change nothing."
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Releases run only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "error: releases run only from main, not $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the test suite
        run: python3 -m unittest discover -s tests

      - name: Plan the version
        id: plan
        run: python3 scripts/plan-release.py >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install agy
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and check the Claude tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 scripts/build-claude.py build "$VERSION" | tee "$RUNNER_TEMP/claude-build.txt"
          python3 scripts/build-claude.py check

      - name: Build and check the Codex tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 scripts/build-codex.py build "$VERSION" | tee "$RUNNER_TEMP/codex-build.txt"
          python3 scripts/build-codex.py check

      - name: Build and check the Antigravity tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 scripts/build-agy.py build "$VERSION" | tee "$RUNNER_TEMP/agy-build.txt"
          python3 scripts/build-agy.py check

      - name: Summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_TAG: ${{ steps.plan.outputs.source_tag }}
        run: |
          echo "Version: $VERSION"
          echo "Custom-skills tag: $SOURCE_TAG"
          for tree in claude codex agy; do
            echo "== $tree =="
            cat "$RUNNER_TEMP/$tree-build.txt"
          done

      - name: Stop
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing changed."
            exit 0
          fi
          echo "error: publishing isn't set up yet" >&2
          exit 1
